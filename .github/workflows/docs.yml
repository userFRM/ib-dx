name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit: this workflow holds pages: write and id-token: write.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          # The release publishes no checksum of its own, so this is the
          # sha256 of the asset taken from the download, checked before the
          # binary runs in a workflow that can publish. On a version bump,
          # refresh it: curl -sSL <the new asset url> | sha256sum
          curl -sSL -o mdbook.tar.gz https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz
          echo "9ef07fd288ba58ff3b99d1c94e6d414d431c9a61fdb20348e5beb74b823d546b  mdbook.tar.gz" | sha256sum -c -
          tar -xzf mdbook.tar.gz -C "$HOME/.local/bin"
          rm mdbook.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build book
        run: mdbook build docs/book

      # Building the book is the part that can break and is worth knowing
      # about. Publishing it needs Pages turned on for the repository, and
      # where it is not, every push failed on that rather than on anything in
      # the book. Ask first, and publish only where there is somewhere to
      # publish to.
      - name: Is there a Pages site to publish to
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages is not enabled for ${{ github.repository }}; the book built and is not being published." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: docs/book/book

    outputs:
      pages: ${{ steps.pages.outputs.enabled }}

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pinned by commit: this workflow holds pages: write and id-token: write,
      # and this step spends the identity token to deploy the site.
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
